name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    uses: p-arndt/.github/.github/workflows/sveltekit-ci.yml@v1
    with:
      build: true

  rust:
    uses: p-arndt/.github/.github/workflows/rust-ci.yml@v1
    with:
      os: '["macos-26", "windows-latest"]'

  rust-format:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --all --check

  # The reusable rust-ci workflow runs without a database, so the integration
  # tests would only ever skip there. This job runs them against the same
  # compose.yaml as `just test-it` (Postgres plus the SSH server for the tunnel
  # test, which a plain service container cannot provide). Linux, because
  # Docker is not available on the macOS and Windows runners.
  rust-db:
    name: DB integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # test-it sets GUCKPG_REQUIRE_DB=1, so a missing database fails the job
      # instead of letting every DB test skip.
      - run: just test-it
      - name: Service logs
        if: failure()
        run: docker compose logs
