# Local test targets: a Postgres and an SSH server that can reach it as
# `postgres`, the same situation as a VPS with Postgres in a container.
# `just test-it` starts them (`just db-up`) and runs all Rust tests against both;
# `just db-down` stops them.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: guckpg
      POSTGRES_PASSWORD: guckpg
      POSTGRES_DB: guckpg
    ports:
      - 127.0.0.1:55432:5432
    healthcheck:
      test: [CMD, pg_isready, -U, guckpg]
      interval: 2s
      retries: 30

  ssh:
    image: lscr.io/linuxserver/openssh-server:latest
    environment:
      USER_NAME: guckpg
      USER_PASSWORD: guckpg
      PASSWORD_ACCESS: 'true'
      # The image disables TCP forwarding by default; this mod turns it on.
      DOCKER_MODS: linuxserver/mods:openssh-server-ssh-tunnel
    ports:
      - 127.0.0.1:52222:2222
    # `up --wait` must not return before the mod has enabled forwarding and
    # sshd listens, or the tunnel test races the container start.
    healthcheck:
      test:
        - CMD-SHELL
        - grep -q '^AllowTcpForwarding yes' /config/sshd/sshd_config && nc -z localhost 2222
      interval: 2s
      retries: 60
