# Local test targets: a Postgres and an SSH server that can reach it as
# `postgres`, the same situation as a VPS with Postgres in a container.
# `just test-it` starts them (`just db-up`) and runs all Rust tests against both;
# `just db-down` stops them.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: guckpg
      POSTGRES_PASSWORD: guckpg
      POSTGRES_DB: guckpg
    ports:
      - 127.0.0.1:55432:5432
    healthcheck:
      test: [CMD, pg_isready, -U, guckpg]
      interval: 2s
      retries: 30

  ssh:
    image: lscr.io/linuxserver/openssh-server:latest
    environment:
      USER_NAME: guckpg
      USER_PASSWORD: guckpg
      PASSWORD_ACCESS: 'true'
    volumes:
      - ./dev/ssh-config:/config/sshd/sshd_config.d:ro
    ports:
      - 127.0.0.1:52222:2222
    # Wait for both the listener and the effective forwarding setting.
    healthcheck:
      test:
        - CMD-SHELL
        - /usr/sbin/sshd.pam -T -f /config/sshd/sshd_config -h /config/ssh_host_keys/ssh_host_ed25519_key | grep -q '^allowtcpforwarding yes$' && nc -z localhost 2222
      interval: 2s
      retries: 60
